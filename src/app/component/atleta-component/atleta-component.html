<div id="div-form">
  <form id="form-atleta" (submit)="salvarAtleta()">
    <label for="nome"> Nome: </label>
    <input type="text" id="nome" name="nome" [(ngModel)]="nome" class="input01" placeholder="Digite seu nome" required maxlength="80"/>

    <label for="cpf"> CPF: </label>
    <input type="text" id="cpf" name="cpf" [(ngModel)]="cpf" class="input02" placeholder="Digite seu CPF" required maxlength="14"/>

    <label for="sexo"> Sexo: </label>
    <input type="radio" id="sexoM" name="sexo" [(ngModel)]="sexo" class="btnSelecao" value="M" required/> Masculino
    <input type="radio" id="sexoF" name="sexo" [(ngModel)]="sexo" class="btnSelecao" value="F" required/> Feminino
    <input type="radio" id="sexoN" name="sexo" [(ngModel)]="sexo" class="btnSelecao" value="N" required/> Não declarar

    <label for="cep"> CEP: </label>
    <input type="text" id="cep" name="cep" [(ngModel)]="cep" class="input02" placeholder="Digite seu CEP" required maxlength="9"/>

    <label for="rua-logradouro"> Rua/Logradouro: </label>
    <input type="text" id="rua-logradouro" name="rua-logradouro" [(ngModel)]="ruaLogradouro" class="input01" placeholder="Digite sua rua/logradouro" required maxlength="30"/>

    <label for="bairro"> Bairro: </label>
    <input type="text" id="bairro" name="bairro" [(ngModel)]="bairro" class="input02" placeholder="Digite seu bairro" required maxlength="30"/>

    <label for="cidade"> Cidade: </label>
    <input type="text" id="cidade" name="cidade" [(ngModel)]="cidade" class="input02" placeholder="Digite sua cidade" required maxlength="30"/>

    <label for="estado"> Estado: </label>
    <input type="text" id="estado" name="estado" [(ngModel)]="estado" class="input02" placeholder="Digite seu estado" required maxlength="30"/>

    <label for="uf"> UF: </label>
    <input type="text" id="uf" name="uf" [(ngModel)]="uf" class="input02" placeholder="Digite sua UF" required maxlength="2"/>

    <div id="div-btns">
      <button type="submit" id="btnAdd"> Cadastrar </button>
      <button type="reset" id="btnLimpar"> Limpar </button>

    </div>

  </form>

</div>
